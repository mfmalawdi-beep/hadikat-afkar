[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# Preserve existing Identity email-link routes.
[[redirects]]
  from = "/recovery"
  to = "/admin/"
  status = 200
[[redirects]]
  from = "/confirm"
  to = "/admin/"
  status = 200
[[redirects]]
  from = "/invitation"
  to = "/admin/"
  status = 200
[[redirects]]
  from = "/email/*"
  to = "/admin/"
  status = 200
