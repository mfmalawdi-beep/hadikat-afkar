# =========================================================
# Netlify — حديقة أفكار
# النشر: اربط المستودع، وستُطبَّق هذه الإعدادات تلقائياً
# =========================================================

[build]
  command = "node build.js"   # يعيد توليد posts/posts.json من ملفات Markdown
  publish = "."

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/posts/*"
  [headers.values]
    Cache-Control = "public, max-age=30"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-cache"
